name: Release

# Push a version tag (git tag v1.3.0 && git push origin v1.3.0) to build the
# Mac app and publish it as a GitHub release. Installed copies find it through
# latest-mac.yml. The tag must match "version" in package.json.
#
# Signing and notarization switch on when the secrets in SIGNING.md exist;
# without them the build is unsigned, as releases have been so far.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      # electron-builder uploads the dmg and zip at the same time, and each one
      # tries to create the release when it doesn't exist yet, so the second
      # fails. Create it first as a draft and publish it once every file is up.
      - name: Create the draft release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "LetterBank $GITHUB_REF_NAME (macOS Apple Silicon)" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        run: |
          if [ -n "$MAC_CERTIFICATE" ]; then
            export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
          else
            echo "::warning::No signing certificate in the repository secrets; this release is unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Developer ID Application certificate (.p12, base64) and its password.
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          # Notarization with an app-specific password. Skipped when empty.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
